name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. A security vulnerability goes to the repository's **Security** tab, not here.
        Remove account ids, hostnames and anything else private from what you paste.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The command you ran, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The version of the tool or action you use.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 26, Ubuntu 26.04, Windows 11, GitHub-hosted runner…
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Logs, configuration, sample files.
